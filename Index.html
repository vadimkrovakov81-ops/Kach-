<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2f0; --card:#ffffff; --card2:#f1ebe8; --line:#e6dcd8;
  --txt:#1d1517; --mut:#7b6e72;
  --acc:#d3202f; --acc-dk:#98111e; --acc-t:#c4182a; --acc-soft:#fbe3e5;
  --good:#1f9d57; --bad:#98111e;
  --head:'Oswald','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(60,20,25,.06),0 6px 18px rgba(60,20,25,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140c0e; --card:#1f1316; --card2:#2a1a1e; --line:#3a2529;
    --txt:#f7f1ef; --mut:#ae9ea2;
    --acc:#e22b3d; --acc-dk:#a3121f; --acc-t:#ff6c7a; --acc-soft:#3a1a1f;
    --good:#5fd08e; --bad:#ff6c7a; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140c0e; --card:#1f1316; --card2:#2a1a1e; --line:#3a2529;
  --txt:#f7f1ef; --mut:#ae9ea2;
  --acc:#e22b3d; --acc-dk:#a3121f; --acc-t:#ff6c7a; --acc-soft:#3a1a1f;
  --good:#5fd08e; --bad:#ff6c7a; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:400 15px/1.45 var(--body);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:14px 16px 4px}
.logo{font:600 26px/1 var(--head);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.logo::before{content:'';width:12px;height:26px;background:var(--acc);transform:skewX(-18deg);border-radius:2px}
.logo b{color:var(--acc-t);font-weight:600}
#main{max-width:560px;margin:0 auto;padding:8px 14px 110px}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:500;letter-spacing:.01em}
h1{font-size:32px;line-height:1.08} h2{font-size:22px;line-height:1.15} h3{font-size:18px;line-height:1.2}
.mut{color:var(--mut)} .sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.datenav{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.datenav .dn{flex:1;text-align:center;cursor:pointer;line-height:1.2}
.datenav .dn b{display:block;font:500 22px var(--head)}
.datenav .dn span{font-size:13px;color:var(--mut)}
.icon{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.icon:active{background:var(--card2)}

.badge{display:inline-block;font:500 14px var(--head);letter-spacing:.04em;padding:3px 12px;border-radius:99px;margin-bottom:10px}
.k-gym{background:var(--acc);color:#fff}
.k-bars{background:var(--txt);color:var(--bg)}
.k-rest{background:transparent;color:var(--mut);border:1px solid var(--line)}

/* красный блок: главное «лицо» приложения */
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,var(--acc) 0%,var(--acc-dk) 100%)}
.hero::before,.hero::after{content:'';position:absolute;top:-20px;bottom:-20px;background:rgba(255,255,255,.09);transform:skewX(-20deg);pointer-events:none}
.hero::before{right:22px;width:34px}
.hero::after{right:-26px;width:80px}
.hero>*{position:relative;z-index:1}
.hero .mut{color:rgba(255,255,255,.8)}
.hero .badge{background:#fff;color:var(--acc-dk);border:0}
.hero .bar{background:rgba(255,255,255,.28)} .hero .bar i{background:#fff}
.hero .kpis div{background:rgba(255,255,255,.16)} .hero .kpis span{color:rgba(255,255,255,.82)}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.kpis div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kpis b{display:block;font:500 27px/1.1 var(--head);font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.p i{background:var(--txt)} .bar.f i{background:#ee9ba3} .bar.c i{background:var(--acc)}

.chk{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.chk:last-child{border-bottom:0}
.box{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid #cbbec1;display:grid;place-items:center;transition:.15s}
.chk.on .box,.box.on{background:var(--acc);border-color:var(--acc)}
.box.on::after,.chk.on .box::after{content:'';width:9px;height:16px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.chk .t{flex:1;font-size:16px;font-weight:600}
.chk.on .t{color:var(--mut)}
.chk .s{font-size:12.5px;color:var(--mut);font-weight:400;display:block}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.today{border-color:var(--acc)}

.btn{border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;padding:12px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:var(--acc-dk);color:#fff;border-color:var(--acc-dk)}
.btn.full{width:100%}
.btn:active{filter:brightness(.92)}

input[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.items{list-style:none;margin:10px 0 6px;padding:0}
.items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.items li span:last-child{font-weight:700;white-space:nowrap}
.kc{font:500 30px/1 var(--head);text-align:right;color:var(--acc-t)}
.kc small{display:block;font:400 12px var(--body);color:var(--mut)}
.macro{margin:10px 0}
.macro .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.step{display:flex;align-items:center;gap:8px;margin-top:10px}
.step b{flex:1;text-align:center;font:500 22px var(--head)}
.shop{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop:last-of-type{border-bottom:0}
.shop .box{width:26px;height:26px;border-radius:8px}
.shop .n{flex:1} .shop .n small{display:block;color:var(--mut);font-size:12.5px}
.shop.on .n{opacity:.45;text-decoration:line-through}
.shop .pr{font-weight:700;white-space:nowrap}

.ex .head{display:flex;gap:12px;align-items:center}
.ex .head .nm{flex:1}
.ex .head .nm h3{font-size:19px}
.ex .tg{font:500 17px var(--head);color:var(--acc-t);white-space:nowrap}
.ex.done{opacity:.7}
.hint{font-size:13px;color:var(--mut);margin:10px 0 6px;line-height:1.4}
.hint em{color:var(--acc-t);font-style:normal;font-weight:700}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.setrow .sn{color:var(--mut);text-align:center;font-weight:700}
.setrow input{text-align:center;font-weight:700;font-size:17px}
.setrow .x{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;color:var(--mut)}
.setlbl{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;font-size:12px;color:var(--mut);text-align:center}
.edrow{display:grid;grid-template-columns:1fr 54px 76px;gap:6px;margin-top:8px}
.edbtn{display:flex;gap:6px;margin-top:6px}
.edbtn button{flex:1}

canvas{width:100%;height:170px;display:block}
.stat{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--mut)}
.stat b{color:var(--txt);font-weight:700}
.up{color:var(--good)} .dn2{color:var(--bad)} .flat{color:var(--mut)} .neu{color:var(--txt)}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist button{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 6px}

.scale{display:flex;gap:8px}
.scale button{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:20px;cursor:pointer}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.sw .tr{width:56px;height:32px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
.sw .tr::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#b9acaf;transition:.2s}
.sw.on .tr{background:var(--acc);border-color:var(--acc)} .sw.on .tr::after{left:27px;background:#fff}
.note-item{padding:10px 0;border-bottom:1px solid var(--line)}
.note-item:last-child{border-bottom:0}
.note-item .d{font-size:13px;color:var(--mut)}

#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 18px rgba(60,20,25,.06)}
#nav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:11.5px;cursor:pointer;font-weight:600}
#nav button.on{color:var(--acc-t)}
#nav button.on::before{content:'';position:absolute;top:-9px;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
#nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,8,10,.55);align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-bottom:6px}
.sec{margin:18px 0 8px;font:500 17px var(--head);color:var(--acc-t)}
.empty{padding:22px 8px;text-align:center;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,.chk:focus-visible,[role=checkbox]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

<script>
(function(){
'use strict';

/* ==========================================================================
   ВСЁ, ЧТО МОЖНО МЕНЯТЬ РУКАМИ, НАХОДИТСЯ В ЭТОМ БЛОКЕ (до строки «КОНЕЦ НАСТРОЕК»)
   Большинство настроек (калории, расписание, упражнения) можно менять прямо в приложении:
   ⚙ — калории/расписание, вкладка «Тренировки» → «✎ Правка» — упражнения.
   ========================================================================== */
const STORE_KEY = 'fittrack_v1';

/* ---------- Профиль (по умолчанию) ---------- */
const PROFILE = { height:179, weight:82, fat:18, goal:'Рекомпозиция: набор мышц + снижение % жира' };

/* ---------- Калории и белок ---------- */
const CFG = {
  base:2600,                 // базовая калорийность (TDEE ≈ 2700, лёгкий дефицит)
  gym:200, bars:100, rest:-200,   // поправка по типу дня
  protein:180, fat:75        // цели по белку и жирам, г
};

/* ---------- Расписание: 0=Вс, 1=Пн ... 6=Сб. Значение — id шаблона или 'rest' ---------- */
const SCHEDULE = { 1:'rest', 2:'barsA', 3:'legs', 4:'barsB', 5:'rest', 6:'chest', 0:'back' };

/* ---------- Шаблоны тренировок ----------
   n — название, s — подходов, r — повторы (текст: '6-8', '15', 'max').
   id упражнения общий для всех шаблонов: история и графики считаются по id.
   Всё это можно менять и в самом приложении: Тренировки → «✎ Правка».            */
const TEMPLATES = {
  legs:{ name:'Среда: ноги', kind:'gym', ex:[
    {id:'squat', n:'Приседания со штангой', s:4, r:'6-8'},
    {id:'rdl', n:'Румынская тяга', s:4, r:'8-10'},
    {id:'legpress', n:'Жим ногами', s:3, r:'10-12'},
    {id:'lunge', n:'Выпады / болгарские сплит-приседания', s:3, r:'10'},
    {id:'legcurl', n:'Сгибания ног лёжа', s:3, r:'10-12'},
    {id:'legext', n:'Разгибания ног', s:3, r:'12-15'},
    {id:'calf', n:'Подъём на носки стоя', s:4, r:'12-15'},
    {id:'abs', n:'Пресс: подъём ног / скручивания', s:3, r:'15'}
  ]},
  chest:{ name:'Суббота: грудь и бицепс', kind:'gym', ex:[
    {id:'bench', n:'Жим штанги лёжа', s:4, r:'6-8'},
    {id:'incline', n:'Жим гантелей на наклонной', s:4, r:'8-10'},
    {id:'chestdips', n:'Брусья на грудь (с весом, если легко)', s:3, r:'8-10'},
    {id:'fly', n:'Разведения гантелей / кроссовер', s:3, r:'12-15'},
    {id:'lateral', n:'Махи гантелей в стороны (плечи)', s:3, r:'12-15'},
    {id:'curl', n:'Подъём штанги на бицепс', s:4, r:'8-10'},
    {id:'hammer', n:'Молотки с гантелями', s:3, r:'10-12'},
    {id:'abs', n:'Пресс: подъём ног / скручивания', s:3, r:'15'}
  ]},
  back:{ name:'Воскресенье: спина и трицепс', kind:'gym', ex:[
    {id:'deadlift', n:'Становая тяга', s:3, r:'5-6'},
    {id:'row', n:'Тяга штанги в наклоне', s:4, r:'8-10'},
    {id:'latpull', n:'Тяга верхнего блока', s:3, r:'10-12'},
    {id:'row1', n:'Тяга гантели одной рукой', s:3, r:'10'},
    {id:'reardelt', n:'Задние дельты: махи в наклоне', s:3, r:'12-15'},
    {id:'frpress', n:'Французский жим лёжа', s:4, r:'8-10'},
    {id:'cgbench', n:'Жим узким хватом', s:3, r:'8-10'},
    {id:'pushdown', n:'Разгибания на блоке', s:3, r:'12'}
  ]},
  barsA:{ name:'Вторник: турники A', kind:'bars', ex:[
    {id:'pullup', n:'Подтягивания', s:5, r:'max'},
    {id:'dips', n:'Брусья', s:5, r:'max'},
    {id:'aus', n:'Австралийские подтягивания', s:4, r:'10-12'},
    {id:'muscleup', n:'Выходы силой', s:3, r:'3-5'},
    {id:'legraise', n:'Подъём ног в висе', s:4, r:'12'},
    {id:'pushup', n:'Отжимания', s:3, r:'15-20'}
  ]},
  barsB:{ name:'Четверг: турники B', kind:'bars', ex:[
    {id:'pullupwide', n:'Подтягивания широким хватом', s:5, r:'max'},
    {id:'dips', n:'Брусья', s:5, r:'max'},
    {id:'chinup', n:'Подтягивания обратным хватом', s:4, r:'8-10'},
    {id:'aus', n:'Австралийские подтягивания', s:4, r:'10-12'},
    {id:'muscleup', n:'Выходы силой', s:3, r:'3-5'},
    {id:'legraise', n:'Подъём ног в висе', s:4, r:'12'},
    {id:'pushup', n:'Отжимания', s:3, r:'15-20'}
  ]}
};
/* Упражнения для графиков на вкладке «Прогресс» (id из шаблонов выше) */
const KEY_EX = [ {id:'bench',n:'Жим лёжа'}, {id:'squat',n:'Приседания'}, {id:'pullup',n:'Подтягивания'} ];

/* ---------- Продукты: на 100 г (сырой / сухой вес) ----------
   k — ккал, p — белки, f — жиры, c — углеводы, price — цена ₽/кг (примерная, меняйте под свой город)
   carb:true — продукт участвует в автоподгонке калорий дня (углеводные гарниры)
   unit — масса одной штуки в граммах (для яиц)
   Продукты tuna / nuts / protein / chickenBreast дорогие и в эконом-меню не используются,
   но их можно подставить в MEALS ниже.                                                          */
const FOODS = {
  chickenThigh:{n:'Куриные бёдра (без кожи)', k:120,p:19,f:5, c:0, price:300},
  chickenBreast:{n:'Куриная грудка', k:115,p:23,f:2, c:0, price:400},
  egg:{n:'Яйца', k:157,p:12.7,f:11.5,c:0.7, price:190, unit:55},
  tvorog:{n:'Творог 5%', k:121,p:17,f:5, c:1.8, price:420},
  tuna:{n:'Тунец в с/с', k:96,p:21,f:1, c:0, price:1300},
  pollock:{n:'Минтай (филе)', k:72,p:16,f:1, c:0, price:260},
  milk:{n:'Молоко 2.5%', k:52,p:2.9,f:2.5,c:4.8, price:80},
  protein:{n:'Протеин', k:380,p:78,f:6, c:6, price:2200},
  oats:{n:'Овсянка (сухая)', k:352,p:12.3,f:6.1,c:61, price:80, carb:true},
  buck:{n:'Гречка (сухая)', k:313,p:12.6,f:3.3,c:62, price:100, carb:true},
  rice:{n:'Рис (сухой)', k:340,p:7,f:0.7,c:77, price:90, carb:true},
  potato:{n:'Картофель', k:77,p:2,f:0.4,c:16, price:40, carb:true},
  pasta:{n:'Макароны тв. сортов (сухие)', k:350,p:12.5,f:1.5,c:71, price:90, carb:true},
  rye:{n:'Хлеб ржаной', k:210,p:6.5,f:1.2,c:41, price:130, carb:true},
  nuts:{n:'Орехи (арахис / грецкие)', k:620,p:18,f:55,c:10, price:900},
  oil:{n:'Масло растительное (подсолнечное)', k:899,p:0,f:99.9,c:0, price:140},
  sour:{n:'Сметана 10%', k:115,p:3,f:10,c:3, price:280},
  cabbage:{n:'Капуста', k:28,p:1.8,f:0.1,c:4.7, price:30},
  cucumber:{n:'Огурцы', k:15,p:0.8,f:0.1,c:2.8, price:150},
  tomato:{n:'Помидоры', k:20,p:1.1,f:0.2,c:3.7, price:230},
  carrot:{n:'Морковь', k:35,p:1.3,f:0.1,c:6.9, price:40},
  onion:{n:'Лук', k:41,p:1.4,f:0,c:8.2, price:35}
};

/* ---------- Эконом-меню: одни и те же дешёвые блюда по кругу.
   Блюдо: [продукт, граммы]. Граммовки — для «среднего» дня, дальше углеводные
   гарниры автоматически подгоняются под калораж дня (зал / турники / отдых). ---------- */
const MEALS = {
  B1:{n:'Овсянка на молоке + 2 яйца', i:[['oats',90],['milk',200],['egg',110]]},
  S1:{n:'Творог с ржаным хлебом', i:[['tvorog',150],['rye',80]]},
  L1:{n:'Курица, гречка, салат из капусты и моркови', i:[['chickenThigh',220],['buck',100],['cabbage',150],['carrot',50],['onion',30],['oil',10]]},
  L3:{n:'Курица с картофелем и капустой', i:[['chickenThigh',220],['potato',400],['cabbage',150],['onion',30],['oil',10]]},
  S2:{n:'Яйца вкрутую, хлеб, огурец', i:[['egg',110],['rye',100],['cucumber',100]]},
  D1:{n:'Рис с минтаем и морковью', i:[['rice',100],['pollock',220],['carrot',100],['oil',10]]},
  D2:{n:'Макароны с курицей и капустой', i:[['pasta',100],['chickenThigh',200],['cabbage',150],['onion',30],['oil',10]]}
};
const SLOTS = ['Завтрак','Перекус 1','Обед','Перекус 2','Ужин'];
/* Меню недели: [завтрак, перекус 1, обед, перекус 2, ужин] */
const WEEK_MENU = {
  1:['B1','S1','L1','S2','D1'],
  2:['B1','S1','L3','S2','D2'],
  3:['B1','S1','L1','S2','D1'],
  4:['B1','S1','L3','S2','D2'],
  5:['B1','S1','L1','S2','D1'],
  6:['B1','S1','L3','S2','D2'],
  0:['B1','S1','L1','S2','D1']
};
/* ========================== КОНЕЦ НАСТРОЕК ========================== */

const CHECKS = [
  {id:'breakfast',t:'Завтрак',slot:0},{id:'snack1',t:'Перекус 1',slot:1},{id:'lunch',t:'Обед',slot:2},
  {id:'snack2',t:'Перекус 2',slot:3},{id:'dinner',t:'Ужин',slot:4},
  {id:'vit',t:'Витамины / Омега-3'},{id:'water',t:'2–3 л воды'},
  {id:'workout',t:'Тренировка'},{id:'sleep',t:'Сон 7–8 ч'}
];
const DOW_NAMES=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DOW_SHORT=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const ORDER=[1,2,3,4,5,6,0];
const KIND_LABEL={gym:'Зал',bars:'Турники',rest:'Отдых'};

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const r1=n=>Math.round(n*10)/10;
const todayKey=()=>dkey(new Date());

/* ---------- состояние ---------- */
function defaults(){
  return { v:2, profile:clone(PROFILE), cfg:clone(CFG), schedule:clone(SCHEDULE), templates:clone(TEMPLATES),
    days:{}, work:{}, body:[{d:todayKey(),w:PROFILE.weight,f:PROFILE.fat}], portions:{}, auto:true, shop:{} };
}
function merge(d,p){
  const s=Object.assign({},d,p);
  s.cfg=Object.assign({},d.cfg,p.cfg||{});
  s.schedule=Object.assign({},d.schedule,p.schedule||{});
  s.profile=Object.assign({},d.profile,p.profile||{});
  s.templates=(p.templates&&Object.keys(p.templates).length)?p.templates:d.templates;
  ['days','work','portions','shop'].forEach(k=>{s[k]=p[k]||{};});
  s.body=Array.isArray(p.body)?p.body:d.body;
  if((p.v||1)<2){s.templates=clone(d.templates);s.schedule=clone(d.schedule);s.portions={};}
  s.v=2;
  return s;
}
function load(){
  let raw=null; try{raw=localStorage.getItem(STORE_KEY);}catch(e){}
  const d=defaults(); if(!raw) return d;
  try{return merge(d,JSON.parse(raw));}catch(e){return d;}
}
let S=load();
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){} }

let view=todayKey();
const ui={tab:'today',foodDay:new Date().getDay(),edit:false,portion:null,modal:null,msg:'',confirm:null,progEx:''};

/* ---------- логика расписания и питания ---------- */
function kindOf(dow){const t=S.schedule[dow];return S.templates[t]?S.templates[t].kind:'rest';}
function targetKcal(dow){return S.cfg.base+(S.cfg[kindOf(dow)]||0);}
function curTpl(){
  const dow=parseKey(view).getDay(), w=S.work[view];
  let t=w&&w.tpl; if(!t) t=S.schedule[dow];
  return S.templates[t]?t:null;
}
function dayPlan(dow){
  const target=targetKcal(dow);
  const meals=WEEK_MENU[dow].map(id=>({name:MEALS[id].n,items:MEALS[id].i.map(a=>({f:a[0],g:a[1]}))}));
  let kc=0,kn=0;
  meals.forEach(m=>m.items.forEach(it=>{const F=FOODS[it.f],k=F.k*it.g/100; if(F.carb) kc+=k; else kn+=k;}));
  let factor=1;
  if(S.auto&&kc>0) factor=Math.min(2,Math.max(.4,(target-kn)/kc));
  const tot={k:0,p:0,f:0,c:0};
  meals.forEach((m,idx)=>{
    m.slot=SLOTS[idx]; m.pct=S.portions[dow+'-'+idx]||100;
    m.t={k:0,p:0,f:0,c:0};
    m.items.forEach(it=>{
      const F=FOODS[it.f]; let g=it.g;
      if(S.auto&&F.carb) g*=factor;
      g*=m.pct/100;
      if(F.unit){it.pcs=Math.max(1,Math.round(g/F.unit)); it.g=it.pcs*F.unit;} else it.g=Math.max(5,Math.round(g/5)*5);
      const mm={k:F.k*it.g/100,p:F.p*it.g/100,f:F.f*it.g/100,c:F.c*it.g/100}; /* не писать в it.f: там id продукта */
      ['k','p','f','c'].forEach(x=>{m.t[x]+=mm[x];});
    });
    ['k','p','f','c'].forEach(x=>{tot[x]+=m.t[x];});
  });
  return {target,kind:kindOf(dow),meals,tot};
}
function carbTarget(target){return Math.max(0,Math.round((target-S.cfg.protein*4-S.cfg.fat*9)/4));}

/* ---------- записи дня / тренировки ---------- */
function dayRec(date){const r=S.days[date]||(S.days[date]={});r.checks=r.checks||{};return r;}
function ensureEx(date,id){
  const w=S.work[date]||(S.work[date]={tpl:curTpl(),ex:{}});
  w.ex=w.ex||{};
  return w.ex[id]||(w.ex[id]={done:false,sets:[],note:''});
}
function lastOf(id,date){
  const ds=Object.keys(S.work).filter(d=>d<date).sort().reverse();
  for(let i=0;i<ds.length;i++){
    const e=S.work[ds[i]].ex&&S.work[ds[i]].ex[id];
    if(e&&e.sets&&e.sets.some(s=>s.r>0||s.w>0)) return {date:ds[i],sets:e.sets.filter(s=>s.r>0||s.w>0)};
  }
  return null;
}
const fmtSet=s=>((s.w>0)?s.w+'×':'')+(s.r||0);
const fmtDate=k=>{const d=parseKey(k);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);};
function hintFor(ex,last){
  if(!last) return 'Первая запись: поставь рабочий вес и запиши, как сделал.';
  const m=/^(\d+)\s*-\s*(\d+)$/.exec(ex.r)||/^(\d+)$/.exec(ex.r);
  const withW=last.sets.some(s=>s.w>0);
  if(!m) return '<em>Цель:</em> побить прошлый результат хотя бы на 1 повтор'+(withW?' или добавить вес':'')+'.';
  const top=+(m[2]||m[1]);
  const all=last.sets.length>=ex.s&&last.sets.every(s=>s.r>=top);
  if(all) return withW?'<em>Все подходы на верхней границе:</em> пора добавить 2,5 кг.':'<em>Все подходы на верхней границе:</em> усложни (пояс с весом, паузы, медленный темп).';
  return '<em>Цель:</em> добрать до '+top+' повторов во всех подходах, потом добавить вес.';
}

/* ---------- иконки ---------- */
const ICONS={
  today:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  food:'<path d="M6 3v8M9 3v8M6 7h3M7.5 11v10M17 3c-2 1.5-3 4-3 7h3v11"/>',
  train:'<path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/>',
  progress:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  journal:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM8 20a3 3 0 01-3-3"/>'
};
const TABS=[['today','Сегодня'],['food','Питание'],['train','Тренировки'],['progress','Прогресс'],['journal','Дневник']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(t=>'<button class="'+(ui.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'"><svg viewBox="0 0 24 24">'+ICONS[t[0]]+'</svg>'+t[1]+'</button>').join('');
}

function dateNav(){
  const d=parseKey(view), isT=view===todayKey();
  return '<div class="datenav"><button class="icon" data-a="day" data-v="-1" aria-label="Предыдущий день">‹</button>'+
    '<div class="dn" data-a="goToday"><b>'+DOW_NAMES[d.getDay()]+'</b><span>'+d.getDate()+' '+MONTHS[d.getMonth()]+(isT?', сегодня':', вернуться к сегодняшнему дню')+'</span></div>'+
    '<button class="icon" data-a="day" data-v="1" aria-label="Следующий день">›</button></div>';
}
const bodySorted=()=>S.body.slice().sort((a,b)=>a.d<b.d?-1:1);

/* ==================== Вкладка «Сегодня» ==================== */
function vToday(){
  const d=parseKey(view), dow=d.getDay(), kind=kindOf(dow), plan=dayPlan(dow);
  const ch=(S.days[view]&&S.days[view].checks)||{};
  const tId=curTpl(), T=tId?S.templates[tId]:null;
  const items=CHECKS.filter(c=>c.id!=='workout'||kind!=='rest');
  const done=items.filter(c=>ch[c.id]).length, pct=Math.round(done/items.length*100);
  const bs=bodySorted(), lb=bs[bs.length-1];
  let h=dateNav();

function exSeries(id){
  const pts=[], ds=Object.keys(S.work).sort(); let anyW=false;
  ds.forEach(d=>{const e=S.work[d].ex&&S.work[d].ex[id]; if(e&&e.sets&&e.sets.some(s=>s.w>0)) anyW=true;});
  ds.forEach(d=>{
    const e=S.work[d].ex&&S.work[d].ex[id]; if(!e||!e.sets) return;
    const vals=e.sets.map(s=>anyW?+s.w:+s.r).filter(v=>v>0);
    if(vals.length) pts.push({x:parseKey(d).getTime(),y:Math.max.apply(null,vals)});
  });
  return {pts:pts,unit:anyW?'кг':'повт'};
}
function seriesFor(key){
  if(key==='weight') return {pts:bodySorted().filter(b=>b.w>0).map(b=>({x:parseKey(b.d).getTime(),y:+b.w})),unit:'кг'};
  if(key==='fat') return {pts:bodySorted().filter(b=>b.f!=null&&b.f!==''&&!isNaN(b.f)).map(b=>({x:parseKey(b.d).getTime(),y:+b.f})),unit:'%'};
  return exSeries(key.slice(3));
}
function trendInfo(pts,th,good){
  if(!pts.length) return {txt:'нет данных',cls:'flat',cur:'—',delta:'—'};
  const last=pts[pts.length-1], from=last.x-30*864e5;
  const ref=pts.find(p=>p.x>=from);
  if(!ref||ref===last) return {txt:'мало данных',cls:'flat',cur:r1(last.y),delta:'—'};
  const d=last.y-ref.y;
  if(Math.abs(d)<th) return {txt:'● плато',cls:'flat',cur:r1(last.y),delta:(d>0?'+':'')+r1(d)};
  const up=d>0, cls=good===0?'neu':((up===(good>0))?'up':'dn2');
  return {txt:up?'▲ растёт':'▼ снижается',cls:cls,cur:r1(last.y),delta:(up?'+':'')+r1(d)};
}
function chartCard(title,key,th,good,sel){
  const s=seriesFor(key), t=trendInfo(s.pts,th,good);
  return '<div class="card"><div class="row-between"><h3>'+title+'</h3><span class="'+t.cls+'" style="font-weight:700">'+t.txt+'</span></div>'+(sel||'')+
    '<canvas data-chart="'+key+'"></canvas><div class="stat"><span>Сейчас: <b>'+t.cur+' '+s.unit+'</b></span><span>За 30 дней: <b>'+t.delta+'</b></span></div></div>';
}

function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hexA(h,a){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')';}
function drawLine(cv,pts,unit){
  const ACC=cssv('--acc'), MUT=cssv('--mut'), LINEC=cssv('--line'), BG=cssv('--card');
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  g.font='11px Manrope,system-ui,sans-serif';
  if(!pts.length){g.fillStyle=MUT;g.textAlign='center';g.fillText('Нет данных. Запиши подходы или замер.',W/2,H/2);return;}
  const pl=36,pr=12,pt=12,pb=24;
  let mn=Math.min.apply(null,pts.map(p=>p.y)), mx=Math.max.apply(null,pts.map(p=>p.y));
  if(mn===mx){mn-=1;mx+=1;} const sp=mx-mn; mn-=sp*.15; mx+=sp*.15;
  const x0=pts[0].x, x1=pts[pts.length-1].x;
  const X=x=>x1===x0?pl+(W-pl-pr)/2:pl+(x-x0)/(x1-x0)*(W-pl-pr);
  const Y=y=>pt+(1-(y-mn)/(mx-mn))*(H-pt-pb);
  g.strokeStyle=LINEC; g.fillStyle=MUT; g.lineWidth=1; g.textAlign='right';
  for(let i=0;i<3;i++){const v=mx-(mx-mn)*i/2, y=Y(v); g.beginPath();g.moveTo(pl,y);g.lineTo(W-pr,y);g.stroke(); g.fillText(r1(v),pl-6,y+4);}
  g.textAlign='left'; const dl=t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1);};
  g.fillText(dl(x0),pl,H-6); if(x1!==x0){g.textAlign='right';g.fillText(dl(x1),W-pr,H-6);}
  if(pts.length>1){
    const gr=g.createLinearGradient(0,pt,0,H-pb); gr.addColorStop(0,hexA(ACC,.25)); gr.addColorStop(1,hexA(ACC,0));
    g.beginPath(); pts.forEach((p,i)=>{i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y));});
    g.lineTo(X(x1),H-pb); g.lineTo(X(x0),H-pb); g.closePath(); g.fillStyle=gr; g.fill();
    g.beginPath(); pts.forEach((p,i)=>{i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y));});
    g.strokeStyle=ACC; g.lineWidth=2.5; g.lineJoin='round'; g.stroke();
  }
  pts.forEach((p,i)=>{g.beginPath();g.arc(X(p.x),Y(p.y),i===pts.length-1?5:3,0,7);g.fillStyle=i===pts.length-1?ACC:BG;g.fill();g.strokeStyle=ACC;g.lineWidth=2;g.stroke();});
}
function drawCharts(){
  document.querySelectorAll('canvas[data-chart]').forEach(cv=>{const s=seriesFor(cv.dataset.chart);drawLine(cv,s.pts,s.unit);});
}

  h+='<div class="card"><div class="sw '+(r.cheat?'on':'')+'" data-a="cheat"><div><b>Срыв / читмил</b><div class="mut sm">Отметь честно: это нужно для статистики, а не для вины</div></div><div class="tr"></div></div></div>';
  h+='<div class="card"><h3 style="margin-bottom:8px">Заметки</h3><textarea data-in="note" placeholder="Как прошёл день, как спал, что болело, что получилось">'+esc(r.note||'')+'</textarea></div>';
  h+='<div class="card"><h3>За 30 дней</h3><div class="kpis"><div><b>'+recent.length+'</b><span>записей</span></div><div><b>'+cheats+'</b><span>срывов</span></div><div><b>'+avg(sl)+'</b><span>сон, ч</span></div></div><div class="mut sm">Средняя энергия: <b style="color:var(--txt)">'+avg(en)+'</b> из 5</div></div>';
  h+='<div class="card"><h3>Последние записи</h3>'+(ds.length?ds.slice(0,12).map(d=>{const x=S.days[d];return '<div class="note-item"><div class="d">'+DOW_SHORT[parseKey(d).getDay()]+', '+fmtDate(d)+(x.cheat?', срыв':'')+(x.sleep?', сон '+x.sleep+' ч':'')+(x.energy?', энергия '+x.energy+'/5':'')+'</div>'+(x.note?'<div>'+esc(x.note)+'</div>':'')+'</div>';}).join(''):'<div class="empty">Пока пусто. Первая запись — сверху.</div>')+'</div>';
  return h;
}

/* ==================== Настройки / бэкап ==================== */
function renderModal(){
  const m=$('#modal');
  if(!ui.modal){m.className='';m.innerHTML='';return;}
  let h='<div class="sheet">';
  if(ui.modal==='settings'){
    const num=(k,l)=>'<div><label class="f">'+l+'</label><input type="number" inputmode="numeric" data-ch="cfg" data-k="'+k+'" value="'+S.cfg[k]+'"></div>';
    h+='<div class="row-between"><h2>Настройки</h2><button class="btn ghost sm" data-a="closeModal">Закрыть</button></div>'+
      '<div class="sec">Калории и макросы</div><div class="grid3">'+num('base','Базовые ккал')+num('gym','Зал, ±ккал')+num('bars','Турники, ±ккал')+num('rest','Отдых, ±ккал')+num('protein','Белок, г')+num('fat','Жиры, г')+'</div>'+
      '<div class="sec">Расписание</div>'+ORDER.map(dw=>'<div class="row-between" style="align-items:center;margin-bottom:8px"><span style="width:36px;font-weight:700">'+DOW_SHORT[dw]+'</span><select data-ch="sched" data-x="'+dw+'"><option value="rest"'+(S.schedule[dw]==='rest'?' selected':'')+'>Отдых</option>'+Object.keys(S.templates).map(id=>'<option value="'+id+'"'+(S.schedule[dw]===id?' selected':'')+'>'+esc(S.templates[id].name)+'</option>').join('')+'</select></div>').join('')+
      '<div class="sec">Профиль</div><div class="grid3"><div><label class="f">Рост, см</label><input type="number" inputmode="numeric" data-ch="prof" data-k="height" value="'+S.profile.height+'"></div></div>'+
      '<div class="sec">Данные</div><button class="btn ghost full" data-a="backup">Экспорт / импорт JSON</button>'+
      '<button class="btn ghost full '+(ui.confirm==='all'?'danger':'')+'" style="margin-top:10px" data-a="resetAll">'+(ui.confirm==='all'?'Точно удалить все данные? Нажми ещё раз':'Сбросить все данные')+'</button>';
  } else {
    h+='<div class="row-between"><h2>Бэкап</h2><button class="btn ghost sm" data-a="closeModal">Закрыть</button></div>'+
      '<div class="sec">Экспорт</div><textarea id="exp" readonly>'+esc(JSON.stringify(S))+'</textarea>'+
      '<div class="grid2" style="margin-top:8px"><button class="btn" data-a="copyJson">Копировать</button><button class="btn ghost" data-a="dlJson">Скачать файл</button></div>'+
      '<div class="mut sm" style="margin-top:6px">Если файл не скачивается, скопируй текст и сохрани в заметки.</div>'+
      '<div class="sec">Импорт</div><textarea id="imp" placeholder="Вставь сюда JSON или выбери файл"></textarea>'+
      '<input type="file" accept=".json,application/json" data-ch="impFile" style="margin-top:8px;width:100%">'+
      '<button class="btn full" style="margin-top:8px" data-a="importJson">Импортировать (заменит текущие данные)</button>';
    if(ui.msg) h+='<div class="sm" style="margin-top:10px;color:var(--acc)">'+esc(ui.msg)+'</div>';
  }
  m.innerHTML=h+'</div>'; m.className='open';
}

/* ==================== Рендер ==================== */
function render(){
  const v={today:vToday,food:vFood,train:vTrain,progress:vProgress,journal:vJournal}[ui.tab];
  $('#main').innerHTML=v(); renderNav();
  if(ui.tab==='progress') drawCharts();
}

/* ==================== События ==================== */
const A={
  tab(el){ui.tab=el.dataset.v;ui.edit=false;ui.confirm=null;render();window.scrollTo(0,0);},
  day(el){const d=parseKey(view);d.setDate(d.getDate()+Number(el.dataset.v));view=dkey(d);ui.edit=false;render();},
  goToday(){view=todayKey();render();},
  check(el){const r=dayRec(view);r.checks[el.dataset.v]=!r.checks[el.dataset.v];save();render();},
  foodDay(el){ui.foodDay=Number(el.dataset.v);ui.portion=null;render();},
  auto(){S.auto=!S.auto;save();render();},
  portionToggle(el){ui.portion=ui.portion===el.dataset.v?null:el.dataset.v;render();},
  portion(el){const k=el.dataset.k,v=Number(el.dataset.v);S.portions[k]=v===0?100:Math.max(30,Math.min(300,(S.portions[k]||100)+v));if(S.portions[k]===100)delete S.portions[k];save();render();},
  shop(el){const f=el.dataset.v;S.shop[f]=!S.shop[f];save();render();},
  shopReset(){S.shop={};save();render();},
  tplPick(el){const w=S.work[view]||(S.work[view]={ex:{}});w.tpl=el.dataset.v;ui.edit=false;ui.confirm=null;save();render();},
  tplAdd(){const id='t'+Date.now().toString(36);S.templates[id]={name:'Новая тренировка',kind:'gym',ex:[]};const w=S.work[view]||(S.work[view]={ex:{}});w.tpl=id;ui.edit=true;save();render();},
  editToggle(){ui.edit=!ui.edit;ui.confirm=null;render();},
  exDone(el){
    const e=ensureEx(view,el.dataset.id);e.done=!e.done;
    const T=S.templates[curTpl()];
    if(T&&T.ex.length&&T.ex.every(x=>S.work[view].ex[x.id]&&S.work[view].ex[x.id].done)) dayRec(view).checks.workout=true;
    save();render();
  },
  addSet(el){
    const id=el.dataset.id,e=ensureEx(view,id),last=lastOf(id,view);
    let base=e.sets.length?e.sets[e.sets.length-1]:(last?last.sets[0]:null);
    e.sets.push({r:base?base.r:'',w:base?base.w:''});save();render();
  },
  delSet(el){const e=ensureEx(view,el.dataset.id);e.sets.splice(Number(el.dataset.n),1);save();render();},
  copyLast(el){const id=el.dataset.id,last=lastOf(id,view);if(!last)return;ensureEx(view,id).sets=last.sets.map(s=>({r:s.r,w:s.w}));save();render();},
  exUp(el){const T=S.templates[curTpl()],i=+el.dataset.x;if(i>0){const t=T.ex[i];T.ex[i]=T.ex[i-1];T.ex[i-1]=t;save();render();}},
  exDown(el){const T=S.templates[curTpl()],i=+el.dataset.x;if(i<T.ex.length-1){const t=T.ex[i];T.ex[i]=T.ex[i+1];T.ex[i+1]=t;save();render();}},
  exDel(el){S.templates[curTpl()].ex.splice(+el.dataset.x,1);save();render();},
  exAdd(){S.templates[curTpl()].ex.push({id:'x'+Date.now().toString(36),n:'Новое упражнение',s:3,r:'8-12'});save();render();},
  tplReset(){const t=curTpl();if(ui.confirm!=='reset:'+t){ui.confirm='reset:'+t;render();return;}S.templates[t]=clone(TEMPLATES[t]);ui.confirm=null;save();render();},
  tplDel(){
    const t=curTpl();if(ui.confirm!=='del:'+t){ui.confirm='del:'+t;render();return;}
    delete S.templates[t];Object.keys(S.schedule).forEach(d=>{if(S.schedule[d]===t)S.schedule[d]='rest';});
    Object.keys(S.work).forEach(d=>{if(S.work[d].tpl===t)delete S.work[d].tpl;});
    ui.confirm=null;ui.edit=false;save();render();
  },
  saveBody(){
    const d=$('#bd').value||todayKey(),w=parseFloat($('#bw').value),f=parseFloat($('#bf').value);
    if(!(w>0)) return;
    const row={d:d,w:w,f:isNaN(f)?null:f},i=S.body.findIndex(b=>b.d===d);
    if(i>=0)S.body[i]=row;else S.body.push(row);save();render();
  },
  delBody(el){S.body=S.body.filter(b=>b.d!==el.dataset.v);save();render();},
  scale(el){const r=S.days[view]||(S.days[view]={checks:{}});const k=el.dataset.k,v=Number(el.dataset.v);r[k]=(+r[k]===v)?0:v;save();render();},
  cheat(){const r=S.days[view]||(S.days[view]={checks:{}});r.cheat=!r.cheat;save();render();},
  settings(){ui.modal='settings';ui.confirm=null;renderModal();},
  closeModal(){ui.modal=null;ui.confirm=null;ui.msg='';renderModal();render();},
  backup(){ui.modal='backup';ui.msg='';renderModal();},
  copyJson(){
    const t=$('#exp');t.focus();t.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>{ui.msg='Скопировано';renderModal();},()=>{});return;}
    ui.msg=ok?'Скопировано':'Не удалось скопировать: выдели текст вручную';renderModal();
  },
  dlJson(){
    try{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='fittrack_backup_'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();ui.msg='Если файл не появился, скопируй текст выше.';}
    catch(e){ui.msg='Скачивание недоступно. Скопируй текст.';}
    renderModal();
  },
  importJson(){
    try{
      const p=JSON.parse($('#imp').value);
      if(!p||typeof p!=='object'||!(p.days||p.work||p.body||p.templates)) throw 0;
      S=merge(defaults(),p);save();ui.msg='Данные импортированы';renderModal();render();
    }catch(e){ui.msg='Не получилось: проверь, что вставлен JSON из экспорта FitTrack.';renderModal();}
  },
  resetAll(){if(ui.confirm!=='all'){ui.confirm='all';renderModal();return;}S=defaults();save();ui.confirm=null;ui.modal=null;renderModal();render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el,e);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=checkbox]')){e.preventDefault();e.target.click();}});

/* ввод без перерисовки (чтобы не терять фокус) */
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='set'){const s=ensureEx(view,el.dataset.id).sets[Number(el.dataset.n)];if(s)s[el.dataset.f]=el.value===''?'':Number(el.value);}
  else if(k==='exnote'){ensureEx(view,el.dataset.id).note=el.value;}
  else if(k==='note'){(S.days[view]||(S.days[view]={checks:{}})).note=el.value;}
  else if(k==='sleep'){(S.days[view]||(S.days[view]={checks:{}})).sleep=el.value;}
  save();
});
/* изменения полей настроек и редактора */
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.ch;if(!k)return;
  const T=S.templates[curTpl()],x=Number(el.dataset.x);
  if(k==='cfg'){S.cfg[el.dataset.k]=Number(el.value)||0;}
  else if(k==='prof'){S.profile[el.dataset.k]=Number(el.value)||S.profile[el.dataset.k];}
  else if(k==='sched'){S.schedule[x]=el.value;}
  else if(k==='tplName'){T.name=el.value||'Тренировка';}
  else if(k==='tplKind'){T.kind=el.value;}
  else if(k==='exName'){T.ex[x].n=el.value||'Упражнение';}
  else if(k==='exSets'){T.ex[x].s=Math.max(1,Number(el.value)||1);}
  else if(k==='exReps'){T.ex[x].r=el.value||'10';}
  else if(k==='progEx'){ui.progEx=el.value;}
  else if(k==='impFile'){const f=el.files[0];if(f){const r=new FileReader();r.onload=()=>{$('#imp').value=r.result;};r.readAsText(f);}return;}
  save();render();
});
window.addEventListener('resize',()=>{if(ui.tab==='progress')drawCharts();});

try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());}catch(e){}
render();
})();
</script>
</body>
</html>
